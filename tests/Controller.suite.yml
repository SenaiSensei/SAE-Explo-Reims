actor: ControllerTester
suite_namespace: App\Tests\Controller
modules:
    # enable helpers as array
    enabled:
        - WebDriver:
              url: 'http://localhost:8000/'
              browser: chrome
              capabilities:
                goog:chromeOptions:
                  args: [ "--headless", "--disable-gpu", "--disable-dev-shm-usage", "--no-sandbox" ]
        - Symfony:
              part: services
              app_path: 'src'
              environment: 'test'
        - Doctrine:
              depends: Symfony # Tells Doctrine to fetch the Entity Manager through Symfony
              cleanup: true # All doctrine queries will be wrapped in a transaction, which will be rolled back at the end of each test
        - \App\Tests\Support\Helper\EntityManagerReset:
              depends: Symfony # Ce « Helper » permet de réinitialiser l'EntityManager entre chaque test pour éviter les effets de bords.
        - Asserts:
